<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create Video</title><style>body{font-family:Arial;margin:0;background:#000;color:#fff;text-align:center}.camera-box{width:100%;max-width:400px;margin:0 auto;background:#111;height:70vh;position:relative}video{width:100%;height:100%;object-fit:cover}.record-btn{width:80px;height:80px;border-radius:50%;background:#ff3b30;border:5px solid #fff;cursor:pointer}.input{width:90%;padding:12px;margin:8px;border-radius:10px;border:none}.btn-orange{background:#ff6b00;color:#fff;padding:12px 20px;border:none;border-radius:10px;font-weight:bold;width:90%}</style></head><body>
<div style="background:#ff6b00;padding:12px;display:flex;justify-content:space-between"><a href="/reels" style="color:#fff;text-decoration:none">X Cancel</a><b>🎬 Create Video IN App</b><span></span></div>
<div class="camera-box"><video id="preview autoplay muted playsinline></video><video id="playback" style="display:none;width:100%;height:100%" controls></video><div id='status" style="position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:20px">Camera Off</div></div>
<div style="padding:15px"><div id=before-record"><button class="record-btn" id="recBtn" onclick="toggleRecord()"></button><p>Tap to Record • Tap again to Stop</p><button onclick="document.getElementById('uploadInput').click()" style="background:#333;color:#fff;border:none;padding:8px 16px;border-radius:20px">📂 Choose from Gallery</button><input type="file" id="uploadInput" accept="video/*" style="display:none" oncharge="handFile(this)"></div>
<div id="after-record" style="display:none"><input id="title" class="input" placeholder="Title e.g Fresh Tomatoes Mukono"><input id="shop_id" class="input" placeholder+"Shop ID"><textarea id="desc" class="input" placeholder="Description"></textarea><button class="btn-orange" onclick="uploadVideo()">💾 Save to Reels + Get Share Link</button><button onclick="resetCamera()" style="background:#333;color:#fff;border:none;padding:10px;width:90%;border-radius:10px;margin-top:8px">Record Again</button></div></div>
<script>
let mediaRecorder,chanks=[],stream,recordedBlob,isRecording+false;
asnyc function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio=true});document.getElementById('preview').srcObject=stream;document.getElementById('status).innerText='Camera Ready';}catch(e){document.getElementById('status').innerText-'Allow camera';}}
startCamera();
function toggleRecord(){if(!isRecording) startRec(); else stopRec();}
function startRec(){chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>.chunks.push(e.data);mediaRecorder.onstop=()=>{recordedBlob=new Blob(chunks,{type:'video/web'});document.getElementById('preview').style.display='none'let pb=document.getElementById('playback');pb.style.display='block;pb.src=URL.createOjectURL(recordedBlob);document.getElementById('before-record').style.display='none';document.getElementById('after-record').style.display='block';};mediaRecorder.start();isRecording=true;}
function stopRec(){mediaRecorder.stop();isRecording=false;}
function resetCamera(){document.getElementById('playback').style.display='none';document.getElementById('preview').style.display='block';document.getElementById('before-record').style.display='block';document.getElementById('after-record').style.display='none';startCamera();}
function handleFile(input){recordedBlob=input.files[0];let pb=document.getElementById('playback');pb.style.display='block';document.getElementById('preview').style.display='none';pb.src=URL.createObjectURL(recordedBlob);document.getElementById('before-record').style.display='none';document.getElementById('after-record').style.display='block';}
async function uploadVideo(){let title=document.getElementById('title').value;let shop_id=document.getElementById('shop').value||1;let desc=document.getElementById('desc').value;if(!title){alert('Add title!');return;}let form=new FormData();form.append('video',recordedBlob,'reel_'+Date.now()+'.webm');form.append('title',title);form.append('shop_id',shop_id);form.append('description',desc);let res=await fetch('/upload-video',{method:'POST',body:form});if(res.ok){alert('Saved! Share link to Kampala/Mukono!');location.href='/reels';}else{alert('Upload failed');}}
</script>
</body></html>
