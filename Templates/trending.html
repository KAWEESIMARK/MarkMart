<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trending</title><style>body{font-family:Arial;margin:0;background:#f5f5f5}.header{background:#ff6b00;color:#fff;padding:15px}.card{background:#fff;margin:10px;border-radius:12px;overflow:hidden}.card video{width:100%;height:200px;object-fit:cover{.card-body{padding:12px}.badge{background:#ff3b30;color:#fff;padding:3px 8px;border-radius:10px}</style></head><body>
<div class="header"><h2 style="margin:0">🔥 Trending Now<h2><small>Entebbe • Mukono • Kampala • Zambia</small></div>
{% for v in videos %}<div class="card"><video src="{{ v.video_url }}" controls></video><div class="card-body"><span class+"badge">🔥 {{ v.views }} views</span><h3>{{ v.title }}</h3><div style="display:flex;gap:10px"><button onclick="fetch('/video/{{v.id}}/like',{method:'POST'}}.then(()=>location.reload())">❤️ Like</button><button><button onclick="navigator.clipboadrd.writeText(window.location.origin+'/video/{{v.vid}}'); alert('Link copied for Kampala/Mukono')">📎 Share Link</button></div></div>{% else %}<p style="padding:20px;text-align:center">No trending yet - post first video!</p>{% endfor %}
</body></html>
